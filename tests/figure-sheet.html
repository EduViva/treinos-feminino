<!doctype html><meta charset="utf-8"><title>sheet</title>
<style>body{margin:0;background:#fff;font:12px system-ui} .row{display:flex;align-items:center;border-bottom:1px solid #ddd} .row b{width:130px;padding:4px} .row svg{width:260px;height:195px;border:1px solid #eee}</style>
<div id="o"></div>
<script type="module">
import { ARTS, sceneSvg } from '/js/figure/scene.js';
const q = new URLSearchParams(location.search);
const keys = q.get('keys') ? q.get('keys').split(',') : Object.keys(ARTS);
const ts = (q.get('t') || '0,0.5,1').split(',').map(Number);
const o = document.getElementById('o');
for (const k of keys) {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<b>${k}</b>` + ts.map(t => sceneSvg(k, t, { arrows: t === ts[ts.length-1] })).join('');
  o.appendChild(r);
}
window.__done = true;
</script>
